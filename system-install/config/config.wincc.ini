; Factory: Siemens WinCC 7 Tag Logging on SQL Server (ROSHAN / PWC10).
; SSMS shows Server name = COMPUTER\WINCC (e.g. CPUPC01\WINCC) + Windows Authentication.
; On the same PC that is identical to .\WINCC — no SQL username/password.
; Do NOT attach dump .mdf files on the factory PC; WinCC already has live TLG DBs.
;
; If the Windows Service runs as LocalSystem and SQL rejects it, either:
;   - run the service as the factory Windows user (e.g. CPUPC01\Operator), or
;   - set auth=sql and fill username/password.
[database]
enabled = true
engine = sqlserver
auth = windows
host = .\WINCC
; Named instance WINCC uses a dynamic port — leave 0. Same as CPUPC01\WINCC on that PC.
port = 0
; auto / auto:tlg_f = newest Tag Logging Fast (*TLG_F*) — flow values
; auto:tlg_s = newest Tag Logging Slow
; auto:alg   = newest Alarm Logging (*ALG*) — use the MsArcLong query below
; auto:cc_rt = WinCC runtime CC_*R (segment catalog, not live flow)
; auto:cc_cs = WinCC config CC_* (tag list, not live values)
database = auto
username =
password =
id_column = id
; Keep this small so the factory PC and ESP stay cool (one row per poll).
batch_size = 1
connect_timeout_seconds = 5
; TagUncompressed is readable SQL. LEFT JOIN Archive adds the tag name.
; If this returns 0 rows, enable uncompressed logging in WinCC Tag Logging.
; Do not SELECT TagCompressed.BinValues — those bytes are proprietary compressed.
query = SELECT TOP (%(batch_size)s)
        CAST(DATEDIFF(second, '19700101', u.TimeStamp) AS bigint) * 1000
            + u.MS AS id,
        u.ValueID,
        RTRIM(a.ValueName) AS TagName,
        u.TimeStamp,
        u.MS,
        u.RealValue,
        u.Quality,
        u.Flags
        FROM TagUncompressed u
        LEFT JOIN Archive a ON a.ValueID = u.ValueID
        WHERE CAST(DATEDIFF(second, '19700101', u.TimeStamp) AS bigint) * 1000
            + u.MS > %(last_id)s
        ORDER BY u.TimeStamp ASC, u.MS ASC, u.ValueID ASC
; Alarms (set database=auto:alg and replace query= with):
; query = SELECT TOP (%(batch_size)s)
;         CAST(DATEDIFF(second, '19700101', DateTime) AS bigint) * 1000
;             + Ms AS id,
;         MsgNr, DateTime, Ms, State, Counter,
;         RTRIM(Computername) AS Computername,
;         RTRIM(Username) AS Username,
;         RTRIM(Comment) AS Comment
;         FROM MsArcLong
;         WHERE CAST(DATEDIFF(second, '19700101', DateTime) AS bigint) * 1000
;             + Ms > %(last_id)s
;         ORDER BY DateTime ASC, Ms ASC, Counter ASC

[serial]
port = auto
vid_pid = 10C4:EA60
baudrate = 115200
ack_timeout_seconds = 90
reconnect_delay_seconds = 5
startup_delay_seconds = 3

[runtime]
poll_interval_seconds = 30
retry_delay_seconds = 20
state_db = ../data/state.sqlite3

[logging]
file = ../logs/plcbridge.log
level = INFO
max_bytes = 2097152
backup_count = 3
