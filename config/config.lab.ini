; Lab-only MySQL (Docker). Not for factory production.
; Keep polls light: small batch + longer interval.
[database]
enabled = true
host = 127.0.0.1
port = 3307
database = plcbridge_lab
username = bridge
password = bridge
id_column = id
batch_size = 5
connect_timeout_seconds = 5
query = SELECT id, temperature, note, created_at
        FROM lab_events
        WHERE id > %(last_id)s
        ORDER BY id ASC
        LIMIT %(batch_size)s

[serial]
port = auto
vid_pid = 10C4:EA60
baudrate = 115200
ack_timeout_seconds = 90
reconnect_delay_seconds = 5
; Allow an ESP32 reset caused by opening the CP2102 port to finish booting / Wi-Fi.
startup_delay_seconds = 3

[runtime]
poll_interval_seconds = 10
retry_delay_seconds = 15
state_db = ../data/lab_state.sqlite3

[logging]
file = ../logs/plcbridge-lab.log
level = INFO
max_bytes = 1048576
backup_count = 3
