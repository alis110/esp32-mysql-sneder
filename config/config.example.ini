; Copy to config.ini. Keep this file private because it contains credentials.
[database]
; Safety guard: leave false until the real schema and query have been inspected.
enabled = false
host = 127.0.0.1
port = 3306
database = REPLACE_WITH_DATABASE
username = REPLACE_WITH_READONLY_USER
password = REPLACE_WITH_PASSWORD
id_column = id
batch_size = 5
connect_timeout_seconds = 5
; Prefer only the columns you need (not SELECT *). Must include id_column, ordered ascending.
; mysql-connector substitutes both named parameters; do not add quotes around them.
query = SELECT id
        FROM REPLACE_WITH_TABLE
        WHERE id > %(last_id)s
        ORDER BY id ASC
        LIMIT %(batch_size)s

[serial]
; auto matches CP2102 (10C4:EA60); use COM5 etc. to pin a specific board.
port = auto
vid_pid = 10C4:EA60
baudrate = 115200
ack_timeout_seconds = 90
reconnect_delay_seconds = 5
; Allow an ESP32 reset caused by opening the CP2102 port to finish booting.
startup_delay_seconds = 3

[runtime]
; Longer poll = less MySQL/CPU load on the factory PC.
poll_interval_seconds = 10
retry_delay_seconds = 15
; Relative paths are resolved from the directory containing this config file.
state_db = ../data/state.sqlite3

[logging]
file = ../logs/plcbridge.log
level = INFO
max_bytes = 2097152
backup_count = 3
