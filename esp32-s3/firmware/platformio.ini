; AlisBoard — ESP32-S3 TinyUSB CDC + MSC (Win7 mounts the disk, no driver)
[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = yes
upload_flags =
  --before=no_reset
  --after=hard_reset
  --connect-attempts=20
extra_scripts = pre:extra_script.py
build_src_filter = +<*> -<recovery.cpp> -<msc_test.cpp>
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_ESP32S3_BROWNOUT_DET=0
lib_deps = bblanchon/ArduinoJson@^7.2.1

; After recovery/jtag flash (COM11, PID 1001) — auto-reset works, then USB disk appears:
;   pio run -e esp32-s3-from-recovery -t upload --upload-port COM11
[env:esp32-s3-from-recovery]
extends = env:esp32-s3
build_src_filter = +<*> -<recovery.cpp> -<msc_test.cpp>
board_upload.use_1200bps_touch = yes
upload_flags =

[env:esp32-s3-recovery]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_src_filter = -<*> +<recovery.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0

[env:esp32-s3-jtag]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esp-builtin
upload_speed = 115200
build_src_filter = -<*> +<recovery.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0

; TinyUSB MSC smoke test (8 KB disk). After recovery flash:
;   pio run -e esp32-s3-msctest -t upload --upload-port COM11
[env:esp32-s3-msctest]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 115200
board_upload.use_1200bps_touch = yes
build_src_filter = -<*> +<msc_test.cpp>
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
