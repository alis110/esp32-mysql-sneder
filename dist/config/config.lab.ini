; Local test against the same WinCC SQL Server as production.
; Use Setup → Mock API for the HTTP side. There is no MySQL in this project.
[database]
enabled = true
engine = sqlserver
auth = windows
host = .\WINCC
port = 0
database = auto
username =
password =
id_column = id
batch_size = 1
connect_timeout_seconds = 5
query = SELECT TOP (%(batch_size)s)
        CAST(DATEDIFF(second, '19700101', u.TimeStamp) AS bigint) * 1000
            + u.MS AS id,
        u.ValueID,
        RTRIM(a.ValueName) AS TagName,
        u.TimeStamp,
        u.MS,
        u.RealValue,
        u.Quality,
        u.Flags
        FROM TagUncompressed u
        LEFT JOIN Archive a ON a.ValueID = u.ValueID
        WHERE CAST(DATEDIFF(second, '19700101', u.TimeStamp) AS bigint) * 1000
            + u.MS > %(last_id)s
        ORDER BY u.TimeStamp ASC, u.MS ASC, u.ValueID ASC

[serial]
port = auto
vid_pid = 10C4:EA60
baudrate = 115200
ack_timeout_seconds = 90
reconnect_delay_seconds = 5
startup_delay_seconds = 3

[runtime]
poll_interval_seconds = 30
retry_delay_seconds = 20
state_db = ../data/lab_state.sqlite3

[logging]
file = ../logs/plcbridge-lab.log
level = INFO
max_bytes = 1048576
backup_count = 3
